<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Dev.Web</title>
        <meta charset="UTF-8">
        <link rel = "stylesheet" href = "index.css">
    </head>
    <body>
        <div class = "scene">
            <div class = "masterhead">
                <p class = "wordTitle">Dev.Web</p>
                <p class = "tagLine">Develop your moments</p>
            </div>

            <div class = "titleCard">
                <div class = "topPiece">
                    <span></span>
                </div>

                <div class = "frameCounter">All developers are welcome!</div>

                <div class = "classBody">
                    <h1>Welcome fellow developers</h1>
                    <p class = "loginMsg">Login to catch up on what you missed!</p>

                    <form onsubmit="return false;">
                        <div class = "loginField">
                            <label for = "identifier">Username, email, or phone number</label>
                            <input typer = "text" id = "identifier" placeholder="youremail@example.com">
                        </div>
                        <div class = "loginField">
                            <label for = "password">Password</label>
                            <input type = "password" id = "password" placeholder = "..........">
                        </div>
                        <div class = "forgot">
                            <a href = "#">Forgot Password?</a>
                        </div>

                        <button type = "submit" class = "primaryBtn">Login</button>
                    </form>

                    <div class = "divider"><span>or</span></div>

                    <button type = "button" class = "secondaryBtn">
                        <span class = "dot">f</span>
                        Continue with Facebook
                    </button>
                    <p class = "signup">If you're new here, no worries you can still <a href = "signIn.html">Create an account</a></p>
                </div>

                <div class = "bottomPiece">
                    <span></span>
                </div>
            </div>
            <p class = "Court">Courtesy, of Developer Damarion Williams!!!</p>
        </div>
        
    </body>
</html>
